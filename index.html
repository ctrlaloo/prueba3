<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>for you</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<svg class="web" id="web" viewBox="0 0 200 200" aria-hidden="true"><path d="M0 0L200 0M0 0L200 45M0 0L200 110M0 0L170 200M0 0L90 200M0 0L0 200"/><circle cx="0" cy="0" r="40"/><circle cx="0" cy="0" r="80"/><circle cx="0" cy="0" r="120"/><circle cx="0" cy="0" r="160"/></svg>

<div id="hud">
  <button id="musicBtn" aria-pressed="false">♪ MUSIC</button>
  <button id="sfxBtn" aria-pressed="true">SFX ON</button>
  <button id="resetBtn">RESET EXPERIENCE</button>
</div>

<main>
  <section class="screen" id="login" aria-label="Access">
    <h1 id="l1"></h1>
    <p class="sub" id="l2"></p>
    <form id="form" hidden autocomplete="off">
      <label>WHO ARE YOU?<input id="inName" placeholder="Enter your name..." autocomplete="off" required></label>
      <label>PASSWORD<input id="inPass" type="password" placeholder="• • • • • •" autocomplete="off" required></label>
      <button class="cta" type="submit">ENTER →</button>
      <p id="err" role="alert"></p>
    </form>
  </section>

  <section class="screen" id="hub" aria-label="Hub">
    <h1 id="hubTitle" data-secret="title"></h1>
    <p class="sub">✦ made just for you ✦</p>
    <div id="prog"></div>
    <div id="cards"></div>
    <small id="found" class="sub"></small>
    <span id="spider" data-secret="spider" aria-hidden="true">🕷</span>
  </section>

  <section class="screen" id="game" aria-label="Game">
    <button class="ghost" id="back">← BACK TO HUB</button>
    <div id="stage"></div>
  </section>

  <section class="screen" id="letter" aria-label="Letter">
    <p class="sub" id="letterTitle"></p>
    <div class="letter" id="letterBody"></div>
    <div id="gallery"></div>
    <div class="row" id="endRow">
      <button class="cta" id="again">START OVER</button>
      <button class="ghost" id="explore">EXPLORE AGAIN</button>
    </div>
  </section>
</main>

<div id="mascot">
  <div id="bubble" aria-live="polite"></div>
  <button id="pet" aria-label="Pet the little spider"><svg viewBox="0 0 100 84" aria-hidden="true">
    <path d="M26 44L8 34M26 52L6 54M28 60L12 74M32 64L24 80M74 44L92 34M74 52L94 54M72 60L88 74M68 64L76 80" stroke="#8f0610" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M50 24l-13-9v15zM50 24l13-9v15z" fill="#ff9ec4"/><circle cx="50" cy="24" r="3.5" fill="#e50914"/>
    <circle cx="50" cy="50" r="28" fill="#161616" stroke="#e50914" stroke-width="2"/>
    <g class="eyes"><ellipse cx="39" cy="48" rx="8" ry="9" fill="#fff"/><ellipse cx="61" cy="48" rx="8" ry="9" fill="#fff"/>
    <circle class="pu" cx="40" cy="49" r="4.5" fill="#111"/><circle class="pu" cx="62" cy="49" r="4.5" fill="#111"/></g>
    <ellipse cx="28" cy="60" rx="4.5" ry="3" fill="#ff9ec4" opacity=".7"/><ellipse cx="72" cy="60" rx="4.5" ry="3" fill="#ff9ec4" opacity=".7"/>
    <path d="M45 62q5 5 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg></button>
</div>
<div id="overlay" aria-live="polite"></div>
<div id="toast" role="status"></div>
<div id="lightbox" hidden></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/games.js"></script>
<script>App.init();</script>
</body>
</html>
